<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebMyWidgets</title>

  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      color: #333;
      margin: 0;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 20px;
      background-color: #4CAF50;
      color: white;
      font-size: 2rem;
      border-radius: 8px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .search-container {
      text-align: center;
      margin: 20px 0;
    }

    .search-container input {
      padding: 10px;
      width: 300px;
      font-size: 1rem;
      border: 2px solid #ccc;
      border-radius: 5px;
      margin-right: 10px;
    }

    .search-container button {
      padding: 10px 20px;
      font-size: 1rem;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .search-container button:hover {
      background-color: #45a049;
    }

    .category-tabs {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }

    .category-tabs button {
      padding: 10px 18px;
      font-size: 1rem;
      border: 1px solid #4CAF50;
      background-color: #fff;
      color: #4CAF50;
      border-radius: 999px;
      cursor: pointer;
    }

    .category-tabs button.active {
      background-color: #4CAF50;
      color: #fff;
    }

    .link-list {
      display: flex;
      flex-direction: column;
      margin-top: 20px;
    }

    .link-item {
      background-color: #ffffff;
      border: 1px solid #ddd;
      padding: 15px;
      margin: 10px;
      text-align: left;
      border-radius: 8px;
      transition: transform 0.3s;
      display: flex;
      align-items: center;
    }

    .link-item:hover {
      transform: scale(1.03);
    }

    .link-item a {
      text-decoration: none;
      color: #333;
      font-size: 1.2rem;
      margin-left: 10px;
      display: flex;
      align-items: center;
    }

    .link-icon {
      font-size: 1.4rem;
      color: #4CAF50;
    }

    .pagination {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .pagination button {
      padding: 10px 20px;
      font-size: 1rem;
      border: 1px solid #ddd;
      background-color: #fff;
      cursor: pointer;
      margin: 0 5px;
    }

    .pagination button:hover {
      background-color: #4CAF50;
      color: white;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: #888;
    }
  </style>
</head>
<body>

  <header>
    WebMyWidgets - 工具大集合
  </header>

  <div class="container">
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="搜尋連結..." />
      <button onclick="searchLinks()">搜尋</button>
    </div>

    <div class="category-tabs">
      <button id="tabWebMyWidgets" class="active" onclick="switchCategory('WebMyWidgets')">WebMyWidgets</button>
      <button id="tabTech" onclick="switchCategory('常用技術')">常用技術</button>
    </div>

    <div id="linkList" class="link-list">
      <!-- 動態生成連結 -->
    </div>

    <div class="pagination">
      <button id="prevBtn" onclick="changePage(-1)">上一頁</button>
      <button id="nextBtn" onclick="changePage(1)">下一頁</button>
    </div>
  </div>

  <footer>
    &copy; 2025 WebMyWidgets. All rights reserved.
  </footer>

  <script>
    const allLinks = [
      { text: "抽籤小程式", url: "抽籤.html", icon: "bi-dice-5", category: "WebMyWidgets" },
      { text: "計數器", url: "計數器.html", icon: "bi-journal-code", category: "WebMyWidgets" },
      { text: "錄音(測試中)", url: "錄音.html", icon: "bi-journal-code", category: "WebMyWidgets" },
      { text: "動詞三態測驗", url: "TestVerbs.html", icon: "bi-chat-dots", category: "WebMyWidgets" },
      { text: "Cron 產生器", url: "CronExpression.html", icon: "bi-clock", category: "WebMyWidgets" },
      { text: "Json檢視器", url: "JsonViewer.html", icon: "bi-code-slash", category: "WebMyWidgets" },
      { text: "簡單todo管理", url: "/todolist/trello_style_task_board.html", icon: "bi-bug", category: "WebMyWidgets" },
      { text: "自然發音", url: "Phonics.html", icon: "bi-bar-chart", category: "WebMyWidgets" },
      { text: "計算機", url: "Calculator/index.html", icon: "bi-book", category: "WebMyWidgets" },
      { text: "線上編輯器", url: "https://example.com/online-editor", icon: "bi-pencil-square", category: "常用技術" }
    ];

    const itemsPerPage = 10;
    let currentPage = 1;
    let currentCategory = "WebMyWidgets";

    function displayLinks(links) {
      const linkListDiv = document.getElementById('linkList');
      linkListDiv.innerHTML = '';

      links.forEach(link => {
        const linkDiv = document.createElement('div');
        linkDiv.className = 'link-item';
        linkDiv.innerHTML = `
          <i class="link-icon bi ${link.icon}"></i>
          <a href="${link.url}" target="_blank">${link.text}</a>
        `;
        linkListDiv.appendChild(linkDiv);
      });
    }

    function getPageLinks(links, page) {
      const startIndex = (page - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      return links.slice(startIndex, endIndex);
    }

    function getFilteredLinks() {
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      return allLinks.filter(link =>
        link.category === currentCategory &&
        link.text.toLowerCase().includes(searchQuery)
      );
    }

    function renderCurrentPage() {
      const filteredLinks = getFilteredLinks();
      const totalPages = Math.max(1, Math.ceil(filteredLinks.length / itemsPerPage));
      if (currentPage > totalPages) currentPage = totalPages;

      displayLinks(getPageLinks(filteredLinks, currentPage));
      updatePagination(filteredLinks.length);
    }

    function switchCategory(category) {
      currentCategory = category;
      currentPage = 1;
      document.getElementById('tabWebMyWidgets').classList.toggle('active', category === 'WebMyWidgets');
      document.getElementById('tabTech').classList.toggle('active', category === '常用技術');
      renderCurrentPage();
    }

    function searchLinks() {
      currentPage = 1;
      renderCurrentPage();
    }

    function updatePagination(filteredLinksCount) {
      const totalPages = Math.max(1, Math.ceil(filteredLinksCount / itemsPerPage));
      document.getElementById('prevBtn').disabled = currentPage === 1;
      document.getElementById('nextBtn').disabled = currentPage >= totalPages;
    }

    function changePage(direction) {
      const filteredLinks = getFilteredLinks();
      const totalPages = Math.max(1, Math.ceil(filteredLinks.length / itemsPerPage));
      currentPage += direction;
      if (currentPage < 1) currentPage = 1;
      if (currentPage > totalPages) currentPage = totalPages;

      renderCurrentPage();
    }

    window.onload = function () {
      renderCurrentPage();
    };
  </script>

</body>
</html>
