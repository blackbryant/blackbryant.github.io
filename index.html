<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技術文件庫</title>
    <!-- Prism.js 程式碼高亮主題 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        :root {
            --sidebar-width: 280px;
            --primary-color: #007acc;
            --bg-color: #f9f9f9;
            --border-color: #e1e4e8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; height: 100vh; color: #333; }
        
        /* 左側導覽列 */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-color);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
        }
        .menu-category {
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
            color: #555;
            font-size: 1.1em;
        }
        .menu-list { list-style: none; padding-left: 10px; }
        .menu-item {
            padding: 8px 12px;
            margin: 4px 0;
            cursor: pointer;
            border-radius: 6px;
            color: #444;
            transition: background 0.2s, color 0.2s;
        }
        .menu-item:hover { background-color: #eaeaea; }
        .menu-item.active {
            background-color: #e6f7ff;
            color: var(--primary-color);
            font-weight: 600;
            border-left: 3px solid var(--primary-color);
        }

        /* 右側文章區 */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: #fff;
        }
        .article-container { max-width: 800px; margin: 0 auto; line-height: 1.7; }
        .article-container h1, .article-container h2, .article-container h3 {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 24px;
            margin-bottom: 16px;
        }
        .article-container pre { border-radius: 8px; padding: 16px; overflow-x: auto; }
        .article-container code { background: #f6f8fa; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
        .article-container pre code { background: transparent; padding: 0; }
        .placeholder { color: #888; text-align: center; margin-top: 20vh; font-size: 1.2em; }
    </style>
</head>
<body>

    <!-- 左側分類選單 -->
    <aside class="sidebar" id="sidebar"></aside>

    <!-- 右側文章內容 -->
    <main class="main-content">
        <div class="article-container" id="article-content">
            <div class="placeholder">👈 請從左側選單選擇一篇文章</div>
        </div>
    </main>

    <!-- 引入解析 Markdown 與程式碼高亮的套件 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <script>
        // 1. 定義雙層分類資料與對應的 Markdown 內容
        // 實務上，你可以將 content 改為檔案路徑，透過 fetch('xxx.md') 動態讀取
        const articleData = [
			{
				mainCategory: "前端基礎",
				items: [
					{
						title: "HTML 語意化標籤",
						file: "aa.md" // 改為檔案路徑
					},
					{
						title: "CSS Flexbox 佈局",
						file: "./articles/css-flexbox.md" // 改為檔案路徑
					}
				]
			}
		];

        const sidebar = document.getElementById('sidebar');
        const articleContent = document.getElementById('article-content');
        let activeMenuItem = null; // 紀錄目前被選取的選單項目

        // 2. 動態生成雙層選單
        function renderMenu() {
            articleData.forEach(category => {
                // 建立主分類標題
                const categoryTitle = document.createElement('div');
                categoryTitle.className = 'menu-category';
                categoryTitle.textContent = category.mainCategory;
                sidebar.appendChild(categoryTitle);

                // 建立次項目列表
                const list = document.createElement('ul');
                list.className = 'menu-list';
                
                category.items.forEach(item => {
                    const listItem = document.createElement('li');
                    listItem.className = 'menu-item';
                    listItem.file = item.title;
                    
                    // 綁定點擊事件：渲染文章內容
                    listItem.addEventListener('click', () => {
                        renderArticle(item.file, listItem);
                    });
                    
                    list.appendChild(listItem);
                });
                
                sidebar.appendChild(list);
            });
        }

        // 3. 渲染 Markdown 內容至右側區塊
		async function renderArticle(filePath, clickedElement) {
		    // 【防呆 1】檢查有沒有傳入路徑
		    if (!filePath) {
		        articleContent.innerHTML = '<div class="placeholder" style="color: red;">❌ 錯誤：找不到檔案路徑，請檢查 articleData 是否有設定 file 屬性。</div>';
		        console.error("renderArticle 收到 undefined 的 filePath");
		        return;
		    }
		
		    if (activeMenuItem) activeMenuItem.classList.remove('active');
		    clickedElement.classList.add('active');
		    activeMenuItem = clickedElement;
		
		    articleContent.innerHTML = '<div class="placeholder">⏳ 文章載入中...</div>';
		
		    try {
		        const response = await fetch(filePath);
		        if (!response.ok) throw new Error(`HTTP 錯誤狀態碼: ${response.status}`);
		        
		        const markdownText = await response.text();
		
		        // 【防呆 2】確保轉出來的文字不是空的或 null
		        if (!markdownText) {
		            throw new Error("檔案內容為空");
		        }
		
		        // 這裡確保傳給 marked.parse 的一定是字串
		        articleContent.innerHTML = marked.parse(markdownText);
		        Prism.highlightAll();
		        document.querySelector('.main-content').scrollTop = 0;
		
		    } catch (error) {
		        articleContent.innerHTML = `<div class="placeholder" style="color: red;">❌ 讀取失敗：<br>${error.message}</div>`;
		        console.error("載入文章時發生錯誤:", error);
		    }
		}

        // 啟動應用：初始化選單
        renderMenu();
    </script>
</body>
</html>
